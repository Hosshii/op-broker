[workspace]
members = [
    "crates/macos-remote-protocol",
    "macos-remote-server",
    "macos-remote-client",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "process",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost-build = "0.14"
tonic-prost = "0.14"
which = "6"
