[workspace]
members = ["broker", "ctl", "crates/protocol", "clients/op-secrets-fs"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
prost = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost-build = "0.14"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
nom = { version = "7", default-features = false, features = ["alloc"] }
tower = "0.5"
hyper-util = { version = "0.1", features = ["client", "http1", "http2", "tokio"] }
which = "6"
fuser = "0.15"
libc = "0.2"
zeroize = "1"
nix = { version = "0.29", features = ["mount"] }
base64 = "0.22"
